    - name: Analyze and run app and shared package tests
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py test app_one'
    - name: Require release signing secrets
      script: "set -euo pipefail\nfor key in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do\n  test\
        \ -n \"${!key:-}\" || { echo \"Missing signing variable: $key\" >&2; exit 1; }\ndone"
    - name: Build Android
      script: 'set -euo pipefail

        cd apps/app_one

        flutter build appbundle --release --flavor prod --target lib/main_prod.dart --dart-define-from-file=config/prod.json
        --build-name=1.0.0 --build-number=1'
    artifacts:
