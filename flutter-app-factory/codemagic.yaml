# Generated by App Factory; edit app.yaml and regenerate.
# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
workflows:
  app_one-dev-android-build:
    name: Example App dev android build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
      - app_one_dev
      vars:
        APP_SLUG: app_one
        APP_FLAVOR: dev
    when:
      changeset:
        includes:
        - apps/app_one/
        - packages/
        - automation/
    scripts:
    - name: Install automation dependencies
      script: 'set -euo pipefail

        python3 -m pip install -r automation/requirements.txt'
    - name: Prepare app and public runtime configuration
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py ci-prepare app_one --flavor dev --platform android'
    - name: Resolve Flutter dependencies
      script: 'set -euo pipefail

        cd apps/app_one

        flutter pub get'
    - name: Validate app
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py validate app_one'
    - name: Analyze and run app and shared package tests
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py test app_one'
    - name: Build Android
      script: 'set -euo pipefail

        cd apps/app_one

        flutter build apk --debug --flavor dev --target lib/main_dev.dart --dart-define-from-file=config/dev.json --build-name=1.0.0
        --build-number=1'
    artifacts:
    - apps/app_one/build/app/outputs/flutter-apk/*.apk
    - apps/app_one/build/**/mapping.txt
    - /tmp/xcodebuild_logs/*.log
  app_one-dev-ios-build:
    name: Example App dev ios build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
      - app_one_dev
      vars:
        APP_SLUG: app_one
        APP_FLAVOR: dev
      xcode: latest
      cocoapods: default
    when:
      changeset:
        includes:
        - apps/app_one/
        - packages/
        - automation/
    scripts:
    - name: Install automation dependencies
      script: 'set -euo pipefail

        python3 -m pip install -r automation/requirements.txt'
    - name: Prepare app and public runtime configuration
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py ci-prepare app_one --flavor dev --platform ios'
    - name: Resolve Flutter dependencies
      script: 'set -euo pipefail

        cd apps/app_one

        flutter pub get'
    - name: Validate app
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py validate app_one'
    - name: Analyze and run app and shared package tests
      script: 'set -euo pipefail

        python3 automation/scripts/factory.py test app_one'
    - name: Build iOS
      script: 'set -euo pipefail

        cd apps/app_one

        flutter build ios --simulator --debug --flavor dev --target lib/main_dev.dart --dart-define-from-file=config/dev.json
        --build-name=1.0.0 --build-number=1'
    artifacts:
    - apps/app_one/build/ios/iphonesimulator/*.app
    - apps/app_one/build/**/mapping.txt
    - /tmp/xcodebuild_logs/*.log
  app_one-prod-android-build:
    name: Example App prod android build
