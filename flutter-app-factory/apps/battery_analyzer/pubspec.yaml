name: battery_analyzer
description: Battery Analyzer — built with the flutter-superpower house style.
publish_to: none
version: 1.2.0+12
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  injectable: ^2.7.1
  go_router: ^14.8.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  google_fonts: ^8.0.2
  json_annotation: ^4.11.0
  factory_core:
    path: ../../packages/core
  factory_app_config:
    path: ../../packages/app_config
  factory_ui_kit:
    path: ../../packages/ui_kit
  factory_analytics:
    path: ../../packages/analytics
  factory_networking:
    path: ../../packages/networking
  factory_ads:
    path: ../../packages/ads
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4
flutter:
  uses-material-design: true
  assets:
  - assets/images/
